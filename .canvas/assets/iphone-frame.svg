<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 920" width="460" height="920">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#111114"/>
      <stop offset="1" stop-color="#2b2b30"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="18" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="screen-cutout">
      <rect width="460" height="920" fill="white"/>
      <rect x="33" y="40" width="394" height="840" rx="48" ry="48" fill="black"/>
    </mask>
  </defs>

  <!-- drop shadow + outer body -->
  <g filter="url(#shadow)">
    <rect x="20" y="28" width="420" height="864" rx="58" ry="58" fill="url(#rim)"/>
  </g>
  <!-- inner bezel ring -->
  <rect x="23" y="31" width="414" height="858" rx="56" ry="56" fill="url(#bezel)" mask="url(#screen-cutout)"/>

  <!-- side buttons -->
  <rect x="18" y="170" width="4" height="34" rx="2" fill="#1a1a1d"/>
  <rect x="18" y="230" width="4" height="62" rx="2" fill="#1a1a1d"/>
  <rect x="18" y="310" width="4" height="62" rx="2" fill="#1a1a1d"/>
  <rect x="438" y="220" width="4" height="96" rx="2" fill="#1a1a1d"/>
</svg>
